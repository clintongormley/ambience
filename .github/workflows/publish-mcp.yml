name: Publish MCP to PyPI

# Publishes the mcp-server/ package (ambience-mcp) to PyPI when an `mcp-v*` tag is
# pushed, so the MCP server versions INDEPENDENTLY of the integration's `v*`
# releases (release.yml). Uses PyPI Trusted Publishing (OIDC) — no stored API
# token.
#
# The trusted publisher registered on PyPI must match: repository
# clintongormley/ambience, workflow `publish-mcp.yml`, environment `pypi`.
#
# Release flow:
#   1. bump the version in mcp-server/pyproject.toml + src/ambience_mcp/__init__.py
#   2. git tag mcp-v<version> && git push origin mcp-v<version>

on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch: # manual re-run if a publish needs retrying

# Least privilege: grant nothing by default, scope per job below.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Build + publish ambience-mcp
    # OIDC token for PyPI Trusted Publishing; the environment gates who can run it.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        working-directory: mcp-server
        run: |
          tag="${GITHUB_REF_NAME#mcp-v}"
          pkg="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          echo "tag=$tag package=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag mcp-v$tag does not match package version $pkg"; exit 1; }

      - name: Build sdist + wheel
        working-directory: mcp-server
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mcp-server/dist
