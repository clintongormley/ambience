[project]
name = "ambience"
version = "0.1.0"
description = "Home Assistant custom integration: Ambience"
requires-python = ">=3.13.2"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    # 0.13.210 bundles HA 2025.2.0, our declared minimum (first release to
    # require Python 3.13). CI pins this exact version in the "min" matrix job;
    # local installs resolve to the latest compatible release.
    "pytest-homeassistant-custom-component>=0.13.210",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.coverage.run]
source = ["custom_components.ambience"]
branch = true

[tool.coverage.report]
# Locked to ~the achieved branch-coverage level (99.95%), 1 point of headroom.
# Only two genuinely-unreachable lines remain (config_flow.py:28 dead abort
# guard behind single_config_entry, trace.py import-time setLevel).
fail_under = 99
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(typing\\.)?overload",
    "\\.\\.\\.",
]
