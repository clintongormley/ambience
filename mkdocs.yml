site_name: Ambience
site_description: A condition-based scene engine for Home Assistant.
site_url: https://clintongormley.github.io/ambience/
repo_url: https://github.com/clintongormley/ambience
docs_dir: docs

hooks:
  - mkdocs_hooks/version.py

# Keep internal working docs and the not-yet-published AI-authoring reference
# out of the site. The AI-authoring reference moves under Reference in a later
# task.
exclude_docs: |
  superpowers/
  handoffs/
  developers/ai-authoring/

theme:
  name: material
  logo: assets/logo-light.svg
  favicon: assets/icon-dark.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/lightbox.js

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Introduction:
      - index.md
      - Installation: introduction/installation.md
  - Getting started:
      - getting-started/index.md
      - "1. Scopes and categories": getting-started/step-1-scopes-and-categories.md
      - "2. Your first scene": getting-started/step-2-your-first-scene.md
      - "3. Exposing actions": getting-started/step-3-exposing-actions.md
      - "4. Weather conditions": getting-started/step-4-weather-conditions.md
      - "5. Entity-state conditions": getting-started/step-5-entity-state-conditions.md
      - "6. Scene priority": getting-started/step-6-scene-priority.md
      - "7. Blocking scenes": getting-started/step-7-blocking-scenes.md
      - "8. Pausing & disabling scopes": getting-started/step-8-pausing-and-disabling-scopes.md
      - "9. Debugging scenes": getting-started/step-9-debugging-scenes.md
  - Reference:
      - reference/index.md
      - Conditions:
          - reference/conditions/index.md
          - Day: reference/conditions/day.md
          - Entity state: reference/conditions/entity-state.md
          - Lux: reference/conditions/lux.md
          - Occupancy: reference/conditions/occupancy.md
          - People: reference/conditions/people.md
          - Script: reference/conditions/script.md
          - Sun: reference/conditions/sun.md
          - Template: reference/conditions/template.md
          - Time of day: reference/conditions/time-of-day.md
          - Unavailable: reference/conditions/unavailable.md
          - Weather: reference/conditions/weather.md
      - Actions:
          - reference/actions/index.md
          - Exposed actions: reference/actions/exposed-actions.md
          - Built-in actions: reference/actions/built-in-actions.md
          - Using an action in a scene: reference/actions/using-actions.md
          - Apply on every match: reference/actions/apply-on-every-match.md
          - How actions run: reference/actions/how-actions-run.md
      - Settings reference: reference/settings-reference.md
      - Panel & card: reference/panel-and-card.md
      - AI-assisted scenes:
          - reference/ai-assisted-scenes.md
          - Using the MCP server: reference/ai/mcp-server.md
          - Download and paste: reference/ai/download-and-paste.md
      - Config health: reference/config-health.md
      - Reporting an issue: reference/reporting-an-issue.md
  - Recipes:
      - recipes/index.md
      - Bathroom:
          - recipes/bathroom/index.md
          - Blind: recipes/bathroom/blind.md
          - Extractor fan: recipes/bathroom/fan.md
          - Lights: recipes/bathroom/lights.md
          - Power Shower: recipes/bathroom/power-shower.md
          - Towel rack: recipes/bathroom/towel-rack.md
      - Bedroom:
          - recipes/bedroom/index.md
          - Blinds: recipes/bedroom/blinds.md
          - Lights: recipes/bedroom/lights.md
      - Kitchen / Dining Room:
          - recipes/kitchen-dining/index.md
          - Dining Room: recipes/kitchen-dining/dining-room.md
          - Kitchen: recipes/kitchen-dining/kitchen.md
      - Security:
          - House alarm: recipes/security/alarm.md
  - Developer:
      - developers/index.md
      - Architecture: developers/architecture.md
      - Code layout: developers/code-layout.md
      - Contributing: developers/contributing.md
