[project]
name = "ambience-mcp"
version = "0.2.0-rc.7"
description = "Local MCP server for authoring Home Assistant Ambience scenes"
requires-python = ">=3.11"
dependencies = [
    # mcp 2.0 removed the bundled FastMCP (mcp.server.fastmcp) in favour of
    # MCPServer (mcp.server.mcpserver); server.py targets that 2.x API. Cap the
    # major so a future mcp 3.0 can't silently break installs — the nightly CI
    # job exercises the latest mcp unpinned to catch that ahead of time.
    "mcp>=2,<3",
    "packaging>=23",
    "websockets>=12",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
ambience-mcp = "ambience_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ambience_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
