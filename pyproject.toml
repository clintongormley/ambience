[project]
name = "ambience"
version = "0.1.0"
description = "Home Assistant custom integration: Ambience"
requires-python = ">=3.13.2"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    # 0.13.210 bundles HA 2025.2.0, our declared minimum (first release to
    # require Python 3.13). CI pins this exact version in the "min" matrix job;
    # local installs resolve to the latest compatible release.
    "pytest-homeassistant-custom-component>=0.13.210",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.coverage.run]
source = ["custom_components.ambience"]
branch = true

[tool.coverage.report]
# Backend is at 100.00% branch+line coverage; fail_under keeps 1 point of
# headroom. The only two genuinely-unreachable spots carry `# pragma: no cover`
# / `no branch` inline: time_of_day._clamp_emptied's endpoint-count guard
# (callers always pass _resolve_range first, which guarantees 2 endpoints) and
# trace.py's import-time logger-level one-shot.
fail_under = 99
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(typing\\.)?overload",
    "\\.\\.\\.",
]
