name: Release

# Publishes a GitHub Release when a v* tag is pushed (HACS reads GitHub
# releases), then opens and auto-merges a follow-up PR bumping main to the next
# minor so unreleased work no longer carries the just-released version.
#
# Release flow:
#   1. bin/release.sh <version>  -> opens the chore/release PR (bumps manifest)
#   2. merge the PR
#   3. git tag v<version> && git push origin v<version>  -> triggers this workflow

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish GitHub Release
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - name: Extract and validate version from tag
        id: version
        env:
          REF: ${{ github.ref }}
        run: |
          VERSION="${REF#refs/tags/v}"
          # Reject off-spec tags (the same semver contract bin/release.sh enforces),
          # so a hand-pushed bad tag can't slip through to a published release.
          bin/bump-version.sh --validate "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Any semver pre-release (a hyphen) is a pre-release; matches the regex,
          # which only permits -alpha/-beta/-rc.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate manifest version matches tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MANIFEST_VER=$(python3 -c "import json; print(json.load(open('custom_components/ambience/manifest.json'))['version'])")
          if [ "$VERSION" != "$MANIFEST_VER" ]; then
            echo "::error::Tag v$VERSION does not match manifest.json version $MANIFEST_VER"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # Pre-releases (alpha/beta/rc) stay off "latest" until promoted via:
          #   gh release edit v<version> --prerelease=false --latest=true
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.prerelease == 'true' && 'false' || 'true' }}

  bump:
    needs: publish
    # Only final releases roll main forward; pre-releases leave the version alone.
    if: needs.publish.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    name: Bump main to next minor
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Compute next minor and bump version files
        id: bump
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          NEXT=$(python3 -c "import os; mj, mn, _ = os.environ['VERSION'].split('-')[0].split('.'); print(f'{mj}.{int(mn)+1}.0')")
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          # Same verified bump bin/release.sh uses, so the two can't drift.
          bin/bump-version.sh "$NEXT"

      - name: Open next-minor bump PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          # Version-less branch name: HACS rejects version numbers in branch names.
          branch: chore/post-release-bump
          base: main
          delete-branch: true
          title: "chore: bump to ${{ steps.bump.outputs.next }} for development"
          commit-message: "chore: bump version to ${{ steps.bump.outputs.next }}"
          body: |
            Post-release bump of `manifest.json` to `${{ steps.bump.outputs.next }}`.

            Released `v${{ needs.publish.outputs.version }}`; this rolls `main`
            forward to the next minor so unreleased work no longer carries the
            just-released version. Auto-merged by the release workflow.

      # main requires a PR (can't push directly), but the bump is trivial,
      # machine-generated, and already verified by bin/bump-version.sh — so
      # merge it automatically. Retry briefly: GitHub computes mergeability
      # asynchronously right after the PR is created.
      - name: Auto-merge the bump PR
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$PR" --merge --delete-branch; then
              echo "Auto-merged bump PR #$PR"
              exit 0
            fi
            echo "merge attempt $attempt failed (PR may not be mergeable yet); retrying in 5s..."
            sleep 5
          done
          echo "::error::failed to auto-merge bump PR #$PR after retries"
          exit 1
