name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Per-channel Python. stable, beta and dev run on 3.14 (required by HA
        # 2026.3+). scripts/ci_ha_install.py installs each one and fails if it
        # ends up on the wrong HA version. A failing install, suite or AI docs
        # check on beta or dev only warns: see the steps below.
        # A single-element python-version + the min include yields exactly four
        # jobs — test (3.14, stable), test (3.14, beta), test (3.14, dev), test
        # (3.13, min). The ruleset's required contexts are among these names.
        python-version: ["3.14"]
        ha-version: ["stable", "beta", "dev"]
        include:
          # Minimum supported HA: 2025.2.0, the first release to require Python
          # 3.13. Pinned to the exact pytest-homeassistant-custom-component
          # release that bundles it, so CI verifies our declared floor still
          # works. Stays on 3.13 — HA 2025.2 predates Python 3.14 support.
          - python-version: "3.13"
            ha-version: "min"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        id: install
        # An unreleased HA must not block a PR, even when it will not install. The
        # later steps need the install, so they check this step's outcome.
        continue-on-error: ${{ matrix.ha-version == 'beta' || matrix.ha-version == 'dev' }}
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.ha-version }}" = "min" ]; then
            # Pin to HA 2025.2.0, our declared minimum supported version.
            python -m pip install pytest pytest-asyncio pytest-cov
            python -m pip install "pytest-homeassistant-custom-component==0.13.210"
          else
            python scripts/ci_ha_install.py "${{ matrix.ha-version }}" \
              --extra pytest --extra pytest-asyncio --extra pytest-cov
          fi
          python -c "from homeassistant.const import __version__; print(__version__)"

      - name: Warn when an unreleased Home Assistant cannot be installed
        if: steps.install.outcome == 'failure'
        run: echo "::warning::Could not install Home Assistant ${{ matrix.ha-version }}"

      - name: Run tests with coverage
        id: pytest
        if: steps.install.outcome == 'success'
        # The coverage floor (fail_under) and branch=true are read from
        # [tool.coverage.*] in pyproject.toml, so this fails if coverage drops.
        # An unreleased HA must not block a PR. This sits on the step because
        # job-level continue-on-error still fails a required check.
        continue-on-error: ${{ matrix.ha-version == 'beta' || matrix.ha-version == 'dev' }}
        run: |
          pytest tests/ \
            --cov=custom_components.ambience \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Warn when an unreleased Home Assistant fails the suite
        if: steps.pytest.outcome == 'failure'
        run: echo "::warning::Pytest failed on Home Assistant ${{ matrix.ha-version }}"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        # Skips only an install failure that was tolerated: a failed stable or
        # floor install still reaches this step, as it always has.
        if: always() && !(steps.install.outcome == 'failure' && steps.install.conclusion == 'success')
        with:
          name: coverage-report-${{ matrix.python-version }}-${{ matrix.ha-version }}
          path: coverage.xml

      - name: Verify committed AI docs match generator output
        id: ai_docs
        if: steps.install.outcome == 'success'
        # The knowledge pack's code-derived sections must track the shipped
        # conditions/services; a stale commit would ship wrong authoring docs.
        # Uses the same Make target as the pre-push hook so the checked paths
        # (incl. the integration's shipped guide) can't drift between them.
        # The generator imports the integration, so an unreleased HA can break it:
        # the stable and min jobs are the ones that enforce this.
        continue-on-error: ${{ matrix.ha-version == 'beta' || matrix.ha-version == 'dev' }}
        run: |
          make ai-docs-check || {
            if [ "${{ matrix.ha-version }}" != "beta" ] && [ "${{ matrix.ha-version }}" != "dev" ]; then
              echo "::error::AI knowledge pack is stale. Run 'make ai-docs' and commit the result."
            fi
            exit 1
          }

      - name: Warn when an unreleased Home Assistant fails the AI docs check
        if: steps.ai_docs.outcome == 'failure'
        run: echo "::warning::AI docs check failed on Home Assistant ${{ matrix.ha-version }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      # Markdown formatting (mdformat via uvx; toolchain pinned in the Makefile).
      - run: pip install uv
      - run: make lint-md

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Lint + format check (Biome)
        run: npm run ci

      - name: Type check
        run: npm run check

      - name: Test with coverage
        # Coverage thresholds are enforced in vitest.config.ts.
        run: npm run coverage

      - name: Build bundle
        run: npm run build

      - name: Verify committed bundle matches build output
        run: |
          if ! git diff --exit-code custom_components/ambience/frontend/; then
            echo "::error::Built bundle differs from committed bundle."
            echo "::error::Run 'npm run build' locally and commit the result."
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # All i18n checks are stdlib-only — no dependencies to install.
      - name: i18n gates (parity, completeness, no-hardcoded)
        run: make i18n
      - name: MCP protocol gate
        run: make mcp-gate

  mcp-server:
    # Unit tests for the standalone mcp-server package. Isolated deps via uv, so
    # this needs no HA test environment; ruff already covers it in the lint job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install uv
      - name: mcp-server tests
        run: make mcp-tests

  changelog:
    # User-facing PRs (feat/fix/perf) must add a CHANGELOG.md [Unreleased] entry.
    # Title-type-driven, so it only runs where the PR title exists.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # need base + head commits for the changelog diff
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # Stdlib-only — nothing to install.
      - name: Require a CHANGELOG entry for user-facing PRs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m bin.changelog check --title "$PR_TITLE" --base "$BASE_SHA" --head "$HEAD_SHA"
