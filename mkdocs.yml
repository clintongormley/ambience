site_name: Ambience
site_description: A condition-based scene engine for Home Assistant.
site_url: https://clintongormley.github.io/ambience/
repo_url: https://github.com/clintongormley/ambience
docs_dir: docs

# Keep internal working docs out of the published site.
exclude_docs: |
  superpowers/
  handoffs/
  reference/

theme:
  name: material
  logo: assets/logo-light.svg
  favicon: assets/icon-dark.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate
  palette:
    - scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

nav:
  - Introduction: index.md
  - Installation: installation.md
  - Getting started:
      - Overview: getting-started/index.md
      - "1. Scopes and categories": getting-started/step-1-scopes-and-categories.md
      - "2. Your first scene": getting-started/step-2-your-first-scene.md
      - "3. Exposing actions": getting-started/step-3-exposing-actions.md
      - "4. Weather conditions": getting-started/step-4-weather-conditions.md
      - "5. Entity-state conditions": getting-started/step-5-entity-state-conditions.md
      - "6. Scene priority": getting-started/step-6-scene-priority.md
      - "7. Blocking scenes": getting-started/step-7-blocking-scenes.md
      - "8. Pausing & disabling scopes": getting-started/step-8-pausing-and-disabling-scopes.md
      - "9. Debugging scenes": getting-started/step-9-debugging-scenes.md
  - Conditions:
      - Overview: conditions/index.md
      - Day: conditions/day.md
      - Entity state: conditions/entity-state.md
      - Lux: conditions/lux.md
      - Occupancy: conditions/occupancy.md
      - People: conditions/people.md
      - Script: conditions/script.md
      - Sun: conditions/sun.md
      - Template: conditions/template.md
      - Time of day: conditions/time-of-day.md
      - Unavailable: conditions/unavailable.md
      - Weather: conditions/weather.md
  - Actions:
      - Overview: actions/index.md
      - Exposed actions: actions/exposed-actions.md
      - Built-in actions: actions/built-in-actions.md
      - Using an action in a scene: actions/using-actions.md
      - Apply on every match: actions/apply-on-every-match.md
      - How actions run: actions/how-actions-run.md
  - Settings reference: settings-reference.md
  - Panel & card: panel-and-card.md
  - Troubleshooting:
      - Config health: concepts/config-health.md
      - Reporting an issue: reporting-an-issue.md
