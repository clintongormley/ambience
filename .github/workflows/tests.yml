name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Per-channel Python. stable + dev run on 3.14 (required by HA 2026.3+),
        # where pip resolves pytest-homeassistant-custom-component to its newest
        # release, so stable tests the latest HA. On 3.13 phcc caps at an older
        # HA (silently months behind), so stable/dev don't run there. dev adds
        # --pre to auto-pick-up any phcc pre-release; phcc ships none today, so
        # dev currently mirrors stable (continue-on-error, so a future breaking
        # pre-release warns without blocking).
        # A single-element python-version + the min include yields exactly three
        # jobs — test (3.14, stable), test (3.14, dev), test (3.13, min) — whose
        # names match the branch ruleset's required contexts.
        python-version: ["3.14"]
        ha-version: ["stable", "dev"]
        include:
          # Minimum supported HA: 2025.2.0, the first release to require Python
          # 3.13. Pinned to the exact pytest-homeassistant-custom-component
          # release that bundles it, so CI verifies our declared floor still
          # works. Stays on 3.13 — HA 2025.2 predates Python 3.14 support.
          - python-version: "3.13"
            ha-version: "min"
    continue-on-error: ${{ matrix.ha-version == 'dev' }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.ha-version }}" = "dev" ]; then
            python -m pip install pytest pytest-asyncio pytest-cov
            python -m pip install --pre pytest-homeassistant-custom-component
          elif [ "${{ matrix.ha-version }}" = "min" ]; then
            # Pin to HA 2025.2.0, our declared minimum supported version.
            python -m pip install pytest pytest-asyncio pytest-cov
            python -m pip install "pytest-homeassistant-custom-component==0.13.210"
          else
            python -m pip install pytest pytest-asyncio pytest-cov pytest-homeassistant-custom-component
          fi

      - name: Run tests with coverage
        # The coverage floor (fail_under) and branch=true are read from
        # [tool.coverage.*] in pyproject.toml, so this fails if coverage drops.
        run: |
          pytest tests/ \
            --cov=custom_components.ambience \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}-${{ matrix.ha-version }}
          path: coverage.xml

      - name: Verify committed AI docs match generator output
        # The knowledge pack's code-derived sections must track the shipped
        # conditions/services; a stale commit would ship wrong authoring docs.
        run: |
          python -m bin.gen_ai_docs
          if ! git diff --exit-code docs/developers/ai-authoring/ ai/skill/; then
            echo "::error::AI knowledge pack is stale. Run 'make ai-docs' and commit the result."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Lint + format check (Biome)
        run: npm run ci

      - name: Type check
        run: npm run check

      - name: Test with coverage
        # Coverage thresholds are enforced in vitest.config.ts.
        run: npm run coverage

      - name: Build bundle
        run: npm run build

      - name: Verify committed bundle matches build output
        run: |
          if ! git diff --exit-code custom_components/ambience/frontend/; then
            echo "::error::Built bundle differs from committed bundle."
            echo "::error::Run 'npm run build' locally and commit the result."
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # All i18n checks are stdlib-only — no dependencies to install.
      - name: i18n gates (parity, completeness, no-hardcoded)
        run: make i18n

  changelog:
    # User-facing PRs (feat/fix/perf) must add a CHANGELOG.md [Unreleased] entry.
    # Title-type-driven, so it only runs where the PR title exists.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # need base + head commits for the changelog diff
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # Stdlib-only — nothing to install.
      - name: Require a CHANGELOG entry for user-facing PRs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m bin.changelog check --title "$PR_TITLE" --base "$BASE_SHA" --head "$HEAD_SHA"
