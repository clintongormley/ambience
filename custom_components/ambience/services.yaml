apply_scene:
  name: Apply scene
  description: >-
    Apply Ambience scenes to one or more scopes. With no scope selected, targets
    every scope. With no category, re-runs the rules for every category. With one
    or more categories, limits to those.
  fields:
    scope:
      name: Scopes
      description: >-
        Scopes to apply in (House, a floor, or an area). Leave empty to apply at
        every scope. Values are "house", "floor:FLOOR_ID", or "area:AREA_ID".
      required: false
      selector:
        text:
          multiple: true
    category:
      name: Categories
      description: Limit the apply to these scene categories (by category id).
      required: false
      selector:
        text:
          multiple: true
    force:
      name: Force
      description: >-
        Apply even when a scope is paused (its switch is off). A permanently
        disabled scope is always skipped.
      required: false
      selector:
        boolean: {}
turn_on:
  name: Turn on
  description: >-
    Turn on the targeted entities, skipping any that are already on. Works
    across all on/off-capable domains.
  target:
    entity:
      domain:
        - light
        - switch
        - fan
        - input_boolean
        - humidifier
        - siren
        - media_player
        - remote
        - climate
        - water_heater
turn_off:
  name: Turn off
  description: >-
    Turn off the targeted entities, skipping any that are already off. Works
    across all on/off-capable domains.
  target:
    entity:
      domain:
        - light
        - switch
        - fan
        - input_boolean
        - humidifier
        - siren
        - media_player
        - remote
        - climate
        - water_heater
cover_safe_open:
  name: Open cover (safe)
  description: >-
    Open the targeted covers, skipping any already fully open (no redundant
    relay click).
  target:
    entity:
      domain: cover
cover_safe_close:
  name: Close cover (safe)
  description: >-
    Close the targeted covers, skipping any already fully closed (no redundant
    relay click).
  target:
    entity:
      domain: cover
cover_safe_set_position:
  name: Set cover position (safe)
  description: >-
    Set the targeted covers to a position, skipping any already at that
    position.
  target:
    entity:
      domain: cover
  fields:
    position:
      name: Position
      description: Target position, 0 (closed) to 100 (open).
      required: true
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
cover_safe_set_tilt_position:
  name: Set cover tilt (safe)
  description: >-
    Set the targeted covers to a tilt position, skipping any already at that
    tilt.
  target:
    entity:
      domain: cover
  fields:
    tilt_position:
      name: Tilt position
      description: Target tilt position, 0 to 100.
      required: true
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
