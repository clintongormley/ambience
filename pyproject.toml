[project]
name = "ambience"
version = "0.1.0"
description = "Home Assistant custom integration: Ambience"
requires-python = ">=3.13.2"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-homeassistant-custom-component>=0.13.300",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.coverage.run]
source = ["custom_components.ambience"]
branch = true

[tool.coverage.report]
# Floor set to the current measured branch-coverage level so CI is green
# immediately; raised in the final task once backfill lands.
fail_under = 93
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(typing\\.)?overload",
    "\\.\\.\\.",
]
