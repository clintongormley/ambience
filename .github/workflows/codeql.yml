name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Exclude the generated/minified frontend bundles: they are build
          # artifacts (esbuild output, incl. bundled Lit), so scanning them only
          # yields minification noise and false positives (e.g. Lit's HTML
          # comment-end regex). The TypeScript sources under frontend/src/ are
          # still analysed.
          config: |
            paths-ignore:
              - custom_components/ambience/frontend/ambience-frontend.js
              - custom_components/ambience/frontend/ambience-panel.js
              - custom_components/ambience/frontend/ambience-card.js
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
