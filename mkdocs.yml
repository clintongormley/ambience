site_name: Ambience
site_description: A condition-based scene engine for Home Assistant.
site_url: https://clintongormley.github.io/ambience/
repo_url: https://github.com/clintongormley/ambience
docs_dir: docs

# Keep internal working docs out of the published site.
exclude_docs: |
  superpowers/
  handoffs/
  reference/

theme:
  name: material
  logo: assets/logo-light.svg
  favicon: assets/icon-dark.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate
  palette:
    - scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

nav:
  - Introduction: index.md
  - Installation: installation.md
  - Getting started:
      - Overview: getting-started/index.md
      - "1. The panel and scopes": getting-started/step-1-the-panel-and-scopes.md
      - "2. Categories": getting-started/step-2-categories.md
      - "3. Your first scene": getting-started/step-3-your-first-scene.md
      - "4. Exposing actions": getting-started/step-4-exposing-actions.md
      - "5. Weather conditions": getting-started/step-5-weather-conditions.md
      - "6. Entity-state conditions": getting-started/step-6-entity-state-conditions.md
      - "7. Scene priority": getting-started/step-7-scene-priority.md
      - "8. Blocking scenes": getting-started/step-8-blocking-scenes.md
      - "9. Debugging scenes": getting-started/step-9-debugging-scenes.md
  - Concepts:
      - Scopes & switches: concepts/scopes-and-switches.md
      - Scenes & resolution: concepts/scenes-and-resolution.md
      - Categories: concepts/categories.md
  - Conditions:
      - Overview: conditions/index.md
      - Time of day: conditions/time-of-day.md
      - Entity state: conditions/entity-state.md
      - Sun: conditions/sun.md
      - Weather: conditions/weather.md
      - People: conditions/people.md
      - Occupancy: conditions/occupancy.md
      - Lux: conditions/lux.md
      - Day: conditions/day.md
      - Template: conditions/template.md
      - Script: conditions/script.md
      - Unavailable: conditions/unavailable.md
  - Actions: actions.md
  - Settings reference: settings-reference.md
  - Panel & card: panel-and-card.md
  - Troubleshooting:
      - Config health: concepts/config-health.md
      - Tips & testing: tips-and-testing.md
