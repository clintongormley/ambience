apply_scene:
  name: Apply scene
  description: >-
    Apply scenes at a scope, chosen by its Ambience switch (house, a floor, or
    an area). With no category, re-runs the rules for every category in the
    scope. With a category, re-runs the rules for just that category. With a
    category and a scene name, applies that scene's actions directly (ignoring
    its conditions).
  fields:
    scope:
      name: Scope
      description: The Ambience scope switch (house / a floor / an area) to apply in.
      required: true
      selector:
        entity:
          filter:
            - integration: ambience
              domain: switch
    category:
      name: Category
      description: Limit the apply to a single scene category (by category id).
      required: false
      selector:
        text: {}
    scene:
      name: Scene
      description: >-
        Apply this named scene's actions directly, bypassing its conditions.
        Requires a category.
      required: false
      selector:
        text: {}
    force:
      name: Force
      description: Apply even when the scope's switch is off.
      required: false
      default: false
      selector:
        boolean: {}
